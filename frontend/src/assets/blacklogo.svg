<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Font Import: Outfit mimics the modern, clean look of the Instagram wordmark -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;display=swap');
      
      .logo-text {
        font-family: 'Outfit', sans-serif;
        font-size: 80px;
        fill: #000000; /* Solid Black */
        letter-spacing: -1.5px; /* Tight letter spacing like the reference image */
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Text perfectly centered -->
  <text class="logo-text" x="200" y="65">Capture</text>
</svg>
