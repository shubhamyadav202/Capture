<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <style>
      /* Importing the Outfit font */
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;display=swap');
      
      .logo-text {
        font-family: 'Outfit', sans-serif;
        font-size: 85px;
        fill: #FFFFFF; /* Pure White */
        letter-spacing: -1.5px; /* Tight spacing for that modern logo look */
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Text perfectly centered -->
  <text class="logo-text" x="200" y="65">Capture</text>
</svg>
